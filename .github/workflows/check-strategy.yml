name: Check strategy

# Runs the FX strategy test on GitHub's servers, so it needs nothing
# installed on your own machine. The full result appears in the run's log,
# and is also attached as a downloadable file.
#
# Triggers:
#   - automatically whenever the strategy script changes
#   - manually, from the Actions tab, via "Run workflow"

on:
  push:
    paths:
      - "fx-signals/check_strategy.py"
      - "fx-signals/check_universe.py"
      - ".github/workflows/check-strategy.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No dependencies to install — the script is deliberately stdlib only.
      - name: FX breakout test
        run: python3 fx-signals/check_strategy.py

      # Runs even if the FX test failed -- they are independent questions.
      - name: Diversified trend test
        if: always()
        run: python3 fx-signals/check_universe.py

      # Kept even when the run fails, because a failure caused by a blocked
      # data source is itself the thing worth reading.
      - name: Attach the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-check-result
          path: |
            strategy_check_output.txt
            universe_check_output.txt
          if-no-files-found: warn
